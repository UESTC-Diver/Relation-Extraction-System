name: CI

'on':
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Verify dependency lock
        run: |
          test -f requirements.txt
          test -f requirements-dev.txt
          python -m pip check

      - name: Lint (undefined names / unused imports)
        run: ruff check app tests

      - name: API tests
        run: pytest

      - name: Relation extraction eval
        run: |
          python eval/run_eval.py --json > /tmp/eval.json
          # 2.7.0 起金标准含 32 篇（含否认 / 传闻 / 条件负例），真实基线 F1 约 0.88。
          # 门槛设在 0.85：低于此说明有实质回退，而不是评测集改动带来的正常波动。
          python -c "import json; d=json.load(open('/tmp/eval.json')); assert d['f1'] >= 0.85, d"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify lockfile
        run: test -f package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
